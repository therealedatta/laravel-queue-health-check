name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: >
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for a tag on this commit
        id: check_tag
        run: |
          existing=$(git tag --points-at HEAD | grep '^v' | head -1 || true)

          if [ -n "$existing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=$existing" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the previous release
        id: previous
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${{ steps.check_tag.outputs.version }}$" | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Determine next version
        if: steps.check_tag.outputs.skip == 'false'
        id: next_version
        run: |
          previous="${{ steps.previous.outputs.tag }}"
          current="${previous:-v0.0.0}"
          current="${current#v}"
          IFS='.' read -r major minor patch <<< "$current"

          # every commit since the previous release counts, or a batch ending in a
          # docs commit would ship features as a patch.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            title="${{ github.event.pull_request.title }}"
            labels="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
            source="$title $labels"
          elif [ -n "$previous" ]; then
            source=$(git log "$previous"..HEAD --pretty=%s)
          else
            source=$(git log --pretty=%s)
          fi

          if echo "$source" | grep -qiE 'breaking|major'; then
            major=$((major + 1)); minor=0; patch=0
          elif echo "$source" | grep -qiE 'feat|feature|minor'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          echo "version=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.check_tag.outputs.skip == 'false'
        run: |
          version="${{ steps.next_version.outputs.version }}"
          git tag "$version"
          git push origin "$version"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.check_tag.outputs.version || steps.next_version.outputs.version }}"

          if [ -z "$version" ]; then
            echo "No version to release"
            exit 0
          fi

          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists"
            exit 0
          fi

          # notes come from the commits, not from --generate-notes: work lands
          # straight on main here, so there are no pull requests to list.
          previous="${{ steps.previous.outputs.tag }}"

          if [ -n "$previous" ]; then
            notes=$(git log "$previous"..HEAD --pretty='- %s')
            notes="$notes

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/$previous...$version"
          else
            notes=$(git log HEAD --pretty='- %s')
          fi

          gh release create "$version" --notes "$notes"
